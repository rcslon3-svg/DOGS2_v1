[platformio]
default_envs = logic_v2_esp32wroom16

[env:logic_v2_esp32wroom16]
platform = espressif32@6.10.0
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_port = COM4
upload_port = COM4
upload_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -Wall
    -Wextra
    -Werror=return-type
